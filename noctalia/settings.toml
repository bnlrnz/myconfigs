[bar.default]
background_opacity = 0.0
capsule = true
capsule_padding = 8.0
capsule_thickness = 0.89999998360872269
center = [ "workspaces" ]
compositor_blur = false
end = [ "tray", "bluetooth", "volume", "brightness", "battery", "date", "clock", "notifications" ]
margin_ends = 0
position = "bottom"
shadow = false
start = [ "taskbar" ]

[desktop_widgets]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[lockscreen]
blur_intensity = 0.79999998211860657
blurred_desktop = true
grace_period_seconds = 5
transition_duration = 500

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1258.0
    output = "DP-3"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1018.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
position = "bottom_right"

[osd]
position = "bottom_right"
position_vertical = "bottom_right"

[shell.animation]
speed = 4.0

[shell.launcher]
category_icons_only = true
layout = "simple"

    [shell.launcher.panels]
    ignored = [ "polkit", "setup-wizard", "test", "launcher", "control-center" ]

[shell.panel]
open_near_click_clipboard = true
open_near_click_control_center = true

[theme]
builtin = "Dracula"
community_palette = "Oxocarbon"
shell_mode = "dark"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "hyprland", "qt" ]

[wallpaper]
directory = "~/Wallpapers"

    [wallpaper.automation]
    enabled = true
    interval_seconds = 600

    [wallpaper.default]
    path = "/home/ben/Wallpapers/Buffalo-Trail-The-Impending-Storm-Albert-Bierstadt.png"

    [wallpaper.last]
    path = "/home/ben/Wallpapers/Buffalo-Trail-The-Impending-Storm-Albert-Bierstadt.png"

    [wallpaper.monitors.DP-3]
    path = "/home/ben/Wallpapers/Buffalo-Trail-The-Impending-Storm-Albert-Bierstadt.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/belo/Wallpapers/PXL_20250907_130854244.PORTRAIT.ORIGINAL~2.jpg"

[widget.taskbar]
only_active_workspace = true
show_window_title = true

[widget.workspaces]
active_pill_size = 2.0
